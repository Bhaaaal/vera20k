; VeraX custom-trail example: Allied Intruder (rules [ORCA], ART [FALC]).
;
; This is the same snippet as the local ARTMD.INI edit used to try the
; feature. It is read by the regression test in src/rules/vera_trail_tests.rs
; through the production ART reader, so this file must stay a plain ART
; fragment: paste the sections below into artmd.ini and the Intruder draws
; two wing-tip trails and one exhaust trail in a `--features verax` build.

[FALC]
VeraTrail.Types=FLAC_WING_L,FLAC_WING_R,FLAC_EXHAUST

[VeraTrailTypes]
0=FLAC_WING_L
1=FLAC_WING_R
2=FLAC_EXHAUST

[FLAC_WING_L]
FLH=0,-90,10
Color=255,255,255
Color2=96,160,255
Width=2
FadeDuration=600
Alpha=200
ZOrder=1

[FLAC_WING_R]
FLH=0,90,10
Color=255,255,255
Color2=96,160,255
Width=2
FadeDuration=600
Alpha=200
ZOrder=1

[FLAC_EXHAUST]
FLH=-80,0,5
Color=255,200,64
Color2=255,64,0
Width=2
FadeDuration=900
Alpha=230
ZOrder=0
