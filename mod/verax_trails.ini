; VeraX custom-trail example: Allied Intruder (rules [ORCA], ART [FALC]).
;
; This is the same snippet the local ARTMD.INI edit used to try the feature. It
; is read by the regression test in src/rules/vera_trail_tests.rs through the
; production ART reader, so this file must stay a plain ART fragment.
;
; To use it as a fragment instead of editing artmd.ini, a `--features verax`
; build reads the Phobos directive:
;
;   [$Include]
;   0=verax_trails_art_example.ini
;
; A listed fragment that is missing is fatal, as in Phobos.

[FALC]
VeraTrail.Types=FLAC_WING_L,FLAC_WING_R ;,FLAC_EXHAUST

[VeraTrailTypes]
0=FLAC_WING_L
1=FLAC_WING_R
2=FLAC_EXHAUST

[FLAC_WING_L]
FLH=0,-90,10
Color=255,255,255
Color2=96,160,255
Width=6
FadeDuration=600
Alpha=200
ZOrder=1

[FLAC_WING_R]
FLH=0,90,10
Color=255,255,255
Color2=96,160,255
Width=6
FadeDuration=600
Alpha=200
ZOrder=1

[FLAC_EXHAUST]
FLH=-80,0,5
Color=255,200,64
Color2=255,64,0
Width=2
FadeDuration=900
Alpha=230
ZOrder=0
